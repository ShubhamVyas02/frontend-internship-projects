<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accordion Component</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Frequently Asked Questions</h1>

        <div class="accordion">

            <button class="accordion-btn" aria-expanded="false">
                What is HTML?
            </button>

            <div class="accordion-content">

                <p>
                    HTML is used to create the structure of webpages.
                </p>

            </div>

        </div>

        <div class="accordion">

            <button class="accordion-btn" aria-expanded="false">
                What is CSS?
            </button>

            <div class="accordion-content">

                <p>
                    CSS is used to style webpages and improve visual appearance.
                </p>

            </div>

        </div>

        <div class="accordion">

            <button class="accordion-btn" aria-expanded="false">
                What is JavaScript?
            </button>

            <div class="accordion-content">

                <p>
                    JavaScript adds interactivity and dynamic behavior to websites.
                </p>

            </div>



        </div>
        <div class="accordion">

            <button class="accordion-btn" aria-expanded="false">
                Why is Accessibility Important?
            </button>

            <div class="accordion-content">

                <p>
                    Accessibility helps make websites usable for all users, including people with disabilities.
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
